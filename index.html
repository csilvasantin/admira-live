  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Oxygen,Ubuntu,sans-serif;line-height:1.55;min-height:100vh}

  .dotline{font-family:monospace;color:var(--mut);font-size:12px;letter-spacing:.18em;margin-top:32px}
